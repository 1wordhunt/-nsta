<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sihirli Instagram Takipçi</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; width: 300px; }
        h2 { color: #E1306C; margin-bottom: 20px; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        button { width: 100%; padding: 12px; background: #0095f6; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #0077c2; }
        #result { margin-top: 20px; color: #333; font-weight: bold; min-height: 20px; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #E1306C; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: none; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>Instagram Takipçi</h2>
    <p>Kullanıcı adını gir ve tıklara bas.</p>
    <input type="text" id="username" placeholder="Kullanıcı Adı (Örn: deneme123)">
    <input type="number" id="followers" placeholder="Takipçi Sayısı (Örn: 100)" value="10">
    <button onclick="addFollowers()">Takipçi Ekle</button>
    <div class="loader" id="loader"></div>
    <div id="result"></div>
</div>

<script>
    function addFollowers() {
        const username = document.getElementById('username').value;
        const count = document.getElementById('followers').value;
        const resultDiv = document.getElementById('result');
        const loader = document.getElementById('loader');

        if (!username || !count) {
            resultDiv.innerText = "Lütfen kullanıcı adı ve sayı gir!";
            resultDiv.style.color = "red";
            return;
        }

        resultDiv.innerText = "";
        loader.style.display = "block";

        // Simüle edilmiş işlem (API gerektirmez, tarayıcıda çalışır)
        setTimeout(() => {
            loader.style.display = "none";
            resultDiv.innerHTML = `🚀 Başarılı!<br><b>${username}</b> hesabına <b>${count}</b> takipçi eklendi.<br>(Sisteme entegre edildi).`;
            resultDiv.style.color = "green";
        }, 1500);
    }
</script>

</body>
</html>
